summary: >-
  Opensense's conformance posture is organizational and platform-level, not
  contract-level. It publishes named attestations and government-cloud
  eligibility, and it implements standard enterprise identity and OAuth 2.0
  client flows. It asserts no API-contract standard — no OpenAPI, AsyncAPI,
  JSON Schema, RFC 9457 problem details, pagination or idempotency convention
  is published, because no public API contract is published at all.
