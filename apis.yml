name: Opensense (formerly SenderGen)
description: >-
  Opensense (formerly SenderGen) is an email signature management platform that
  centrally governs email signatures, banners, and digital business cards across
  Microsoft 365 and Google Workspace. It lets IT enforce on-brand, compliant
  signatures while marketing and sales teams run targeted campaigns, track
  engagement, and connect to CRM and marketing platforms such as Salesforce,
  HubSpot, Marketo, and Outreach. Opensense is SOC 2 Type II attested, operates
  under GDPR and CCPA, and is the only email signature platform running inside
  Microsoft 365 GCC High for ITAR, DFARS, CMMC and FedRAMP-driven tenants. It
  advertises a REST API for custom integrations and serves an llms.txt on both
  its marketing and documentation hosts, but publishes no developer portal, no
  API reference and no machine-readable specification; API keys are issued
  manually by an Opensense integration specialist.
