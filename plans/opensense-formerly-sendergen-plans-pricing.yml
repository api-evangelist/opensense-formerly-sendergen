notes: >-
  Opensense publishes list pricing publicly — unusual for an enterprise
  email-signature platform. Two separate product ladders are priced: Email
  Signature (Signature / Pipeline / Complete) and Email Tracking (Bronze /
  Silver / Gold). Both ladders carry a stated $500/month account minimum, so
  the per-user rate is a floor price rather than the entry cost. Enterprise
  terms remain "contact sales". These are the plans for the PRODUCT; Opensense
  publishes no API-specific plan, quota, or metered API pricing, and API access
  is arranged through an Opensense integration specialist.
